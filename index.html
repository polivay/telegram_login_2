<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Войти в TERO</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh;
      background: linear-gradient(160deg, #e8f5e9 0%, #f9f3d2 50%, #e3f0e8 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      overflow: hidden;
      position: relative;
    }

    .tero-character {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      height: 70vh;
      max-height: 520px;
      object-fit: contain;
      z-index: 1;
    }

    .card {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 420px;
      background: rgba(255,255,255,0.85);
      backdrop-filter: blur(16px);
      border-radius: 28px 28px 0 0;
      padding: 32px 28px 48px;
      text-align: center;
      box-shadow: 0 -8px 40px rgba(0,0,0,0.08);
    }

    .logo {
      font-size: 26px;
      font-weight: 800;
      color: #2d5a27;
      letter-spacing: 2px;
      margin-bottom: 4px;
    }

    .tagline {
      color: #7a9e76;
      font-size: 13px;
      margin-bottom: 28px;
      letter-spacing: 0.5px;
    }

    #telegram-login {
      display: flex;
      justify-content: center;
      margin-bottom: 8px;
    }

    .loading {
      display: none;
      color: #4a8c3f;
      font-size: 14px;
      margin-top: 16px;
      font-weight: 500;
    }

    .dots::after {
      content: '';
      animation: dots 1.5s steps(3, end) infinite;
    }
    @keyframes dots {
      0%   { content: ''; }
      33%  { content: '.'; }
      66%  { content: '..'; }
      100% { content: '...'; }
    }
  </style>
</head>
<body>

  <img
    class="tero-character"
    src="В_полный_рост-removebg-preview.png"
    alt="Tero"
  />

  <div class="card">
    <div class="logo">TERO</div>
    <div class="tagline">Социальная инвестиционная игра</div>

    <div id="telegram-login">
      <script
        async
        src="https://telegram.org/js/telegram-widget.js?22"
        data-telegram-login="TeroGameAuthBot"
        data-size="large"
        data-radius="8"
        data-onauth="onTelegramAuth(user)"
        data-request-access="write">
      </script>
    </div>

    <div class="loading" id="loading">
      Выполняем вход<span class="dots"></span>
    </div>
  </div>

  <script>
    async function onTelegramAuth(user) {
      document.getElementById('loading').style.display = 'block';
      document.getElementById('telegram-login').style.display = 'none';

      try {
        const response = await fetch(
          'https://unsuoaqphxnutqqumzgy.supabase.co/functions/v1/telegram-auth',
          {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ telegramData: user })
          }
        );

        const data = await response.json();

        if (data.email && data.password) {
          window.location.href =
            'https://si-game-e3jo6t.flutterflow.app/telegramCallback' +
            '?email=' + encodeURIComponent(data.email) +
            '&password=' + encodeURIComponent(data.password);
        } else {
          document.getElementById('loading').textContent = 'Ошибка входа. Попробуй ещё раз.';
        }
      } catch (e) {
        document.getElementById('loading').textContent = 'Ошибка соединения.';
      }
    }
  </script>

</body>
</html>
